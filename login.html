<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — YCC Compass</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF1F5; --paper-raised: #FFFFFF; --ink: #101B33; --ink-soft: #4B5876;
    --navy: #14213D; --gold: #B9862F; --gold-soft: #F1E4C8;
    --emerald: #1F6E52; --emerald-soft: #DCEEE5; --line: #D6DBE4;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #0E1524; --paper-raised: #161F35; --ink: #E9ECF4; --ink-soft: #A3ADC6;
      --navy: #E9ECF4; --gold: #D9A84D; --gold-soft: #2A2416;
      --emerald: #4CAE8A; --emerald-soft: #16241F; --line: #2A3552;
    }
  }
  :root[data-theme="dark"] {
    --paper: #0E1524; --paper-raised: #161F35; --ink: #E9ECF4; --ink-soft: #A3ADC6;
    --navy: #E9ECF4; --gold: #D9A84D; --gold-soft: #2A2416;
    --emerald: #4CAE8A; --emerald-soft: #16241F; --line: #2A3552;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  h1, h2 { font-family: 'Fraunces', serif; margin: 0; color: var(--ink); }
  p { margin: 0; color: var(--ink-soft); }
  a { color: inherit; }
  label { font-size: 0.84rem; font-weight: 600; color: var(--ink); display: block; margin-bottom: 6px; }
  input { font-family: inherit; }

  .top { padding: 20px 24px; }
  .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; width: fit-content; }
  .brand-mark { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-mark svg { width: 14px; height: 14px; }
  .brand-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.02rem; color: var(--ink); }
  .brand-name .thin { font-weight: 400; color: var(--ink-soft); }

  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 20px 60px; }
  .auth-card {
    width: 100%; max-width: 400px; background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 8px; padding: 34px 30px 30px;
  }
  .auth-head { text-align: center; margin-bottom: 22px; }
  .auth-head h1 { font-size: 1.5rem; font-weight: 600; }
  .auth-head p { font-size: 0.88rem; margin-top: 6px; }

  .tabs { display: flex; background: var(--paper); border-radius: 6px; padding: 4px; margin-bottom: 24px; }
  .tab-btn {
    flex: 1; border: none; background: none; padding: 9px; border-radius: 5px; cursor: pointer;
    font-size: 0.86rem; font-weight: 600; color: var(--ink-soft); font-family: inherit;
  }
  .tab-btn.active { background: var(--paper-raised); color: var(--ink); box-shadow: 0 1px 2px rgba(16,27,51,0.08); }

  .panel { display: none; }
  .panel.active { display: block; }

  .field { margin-bottom: 16px; }
  .field input {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 5px;
    background: var(--paper); color: var(--ink); font-size: 0.92rem; outline: none;
  }
  .field input:focus { border-color: var(--gold); }

  .role-select { margin-bottom: 18px; }
  .role-select label { margin-bottom: 8px; }
  .role-chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .role-chip {
    font-size: 0.82rem; font-weight: 600; padding: 7px 13px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--paper); cursor: pointer; color: var(--ink-soft);
  }
  .role-chip.active { background: var(--navy); color: var(--paper); border-color: var(--navy); }

  .row-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; font-size: 0.82rem; }
  .row-between a { color: var(--gold); font-weight: 600; text-decoration: none; }
  .checkbox-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 18px; font-size: 0.8rem; }
  .checkbox-row input { margin-top: 3px; accent-color: var(--emerald); }
  .checkbox-row a { color: var(--gold); text-decoration: none; font-weight: 600; }

  .btn-primary {
    width: 100%; padding: 12px; border-radius: 5px; border: 1px solid var(--navy);
    background: var(--navy); color: var(--paper); font-weight: 700; font-size: 0.92rem;
    cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary:disabled { opacity: 0.7; cursor: default; }

  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; font-size: 0.76rem; color: var(--ink-soft); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .btn-google {
    width: 100%; padding: 11px; border-radius: 5px; border: 1px solid var(--line);
    background: var(--paper-raised); color: var(--ink); font-weight: 600; font-size: 0.88rem;
    cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px;
  }

  .switch-line { text-align: center; margin-top: 22px; font-size: 0.86rem; }
  .switch-line a { color: var(--gold); font-weight: 600; text-decoration: none; cursor: pointer; }

  .spinner {
    width: 15px; height: 15px; border: 2px solid rgba(238,241,245,0.4); border-top-color: var(--paper);
    border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .demo-note {
    max-width: 400px; margin: 16px auto 0; text-align: center; font-size: 0.76rem;
    color: var(--ink-soft); opacity: 0.8;
  }
</style>
</head>
<body>

<div class="top">
  <a class="brand" href="index.html">
    <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3L3 12l9 9 9-9-9-9z" stroke="#EEF1F5" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.4" fill="#EEF1F5"/></svg></div>
    <span class="brand-name">YCC <span class="thin">Compass</span></span>
  </a>
</div>

<div class="stage">
  <div>
    <div class="auth-card">
      <div class="auth-head">
        <h1 id="headTitle">Welcome back</h1>
        <p id="headSub">Log in to pick up your pathway where you left off.</p>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tabLogin">Log in</button>
        <button class="tab-btn" id="tabSignup">Create account</button>
      </div>

      <!-- LOGIN PANEL -->
      <div class="panel active" id="panelLogin">
        <form id="formLogin">
          <div class="field">
            <label>Email</label>
            <input type="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" placeholder="••••••••" required>
          </div>
          <div class="row-between">
            <span></span>
            <a href="#">Forgot password?</a>
          </div>
          <button class="btn-primary" type="submit">
            <span class="spinner" id="spinnerLogin"></span>
            <span id="btnLoginText">Log in</span>
          </button>
        </form>

        <div class="divider">or</div>
        <button class="btn-google" id="googleLogin">
          <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.16.29-1.7V4.97H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.03l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
          Continue with Google
        </button>

        <div class="switch-line">New here? <a id="goSignup">Create an account</a></div>
      </div>

      <!-- SIGNUP PANEL -->
      <div class="panel" id="panelSignup">
        <form id="formSignup">
          <div class="role-select">
            <label>I am a</label>
            <div class="role-chips">
              <button type="button" class="role-chip active" data-role="Student">Student</button>
              <button type="button" class="role-chip" data-role="Guardian">Guardian</button>
              <button type="button" class="role-chip" data-role="Counsellor">Counsellor</button>
              <button type="button" class="role-chip" data-role="Employer">Employer</button>
            </div>
          </div>
          <div class="field">
            <label>Full name</label>
            <input type="text" placeholder="Priya Sharma" required>
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" placeholder="At least 8 characters" required>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="terms" required>
            <label for="terms" style="font-weight:400; margin:0;">I agree to the <a href="privacy-policy.html">Privacy Policy</a> and Terms of Service.</label>
          </div>
          <button class="btn-primary" type="submit">
            <span class="spinner" id="spinnerSignup"></span>
            <span id="btnSignupText">Create account</span>
          </button>
        </form>

        <div class="switch-line">Already have an account? <a id="goLogin">Log in</a></div>
      </div>
    </div>

    <p class="demo-note">This is a prototype screen — no account is actually created or stored. Submitting will simulate signing in and take you into the app.</p>
  </div>
</div>

<script>
  const tabLogin = document.getElementById('tabLogin');
  const tabSignup = document.getElementById('tabSignup');
  const panelLogin = document.getElementById('panelLogin');
  const panelSignup = document.getElementById('panelSignup');
  const headTitle = document.getElementById('headTitle');
  const headSub = document.getElementById('headSub');

  function showLogin() {
    tabLogin.classList.add('active'); tabSignup.classList.remove('active');
    panelLogin.classList.add('active'); panelSignup.classList.remove('active');
    headTitle.textContent = 'Welcome back';
    headSub.textContent = 'Log in to pick up your pathway where you left off.';
  }
  function showSignup() {
    tabSignup.classList.add('active'); tabLogin.classList.remove('active');
    panelSignup.classList.add('active'); panelLogin.classList.remove('active');
    headTitle.textContent = 'Create your account';
    headSub.textContent = 'Free to join — upgrade to Premium any time.';
  }

  tabLogin.addEventListener('click', showLogin);
  tabSignup.addEventListener('click', showSignup);
  document.getElementById('goSignup').addEventListener('click', showSignup);
  document.getElementById('goLogin').addEventListener('click', showLogin);

  // Pre-select the Sign up tab if arriving via ?signup
  if (window.location.hash === '#signup' || window.location.search.includes('signup')) {
    showSignup();
  }

  document.querySelectorAll('.role-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.role-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    });
  });

  function simulateAuth(spinnerId, btnTextId, destination) {
    const spinner = document.getElementById(spinnerId);
    const btnText = document.getElementById(btnTextId);
    const originalText = btnText.textContent;
    spinner.style.display = 'inline-block';
    btnText.textContent = 'Just a moment…';
    setTimeout(() => {
      window.location.href = destination;
    }, 900);
  }

  document.getElementById('formLogin').addEventListener('submit', (e) => {
    e.preventDefault();
    simulateAuth('spinnerLogin', 'btnLoginText', 'scholarship-radar.html');
  });
  document.getElementById('formSignup').addEventListener('submit', (e) => {
    e.preventDefault();
    simulateAuth('spinnerSignup', 'btnSignupText', 'scholarship-radar.html');
  });
  document.getElementById('googleLogin').addEventListener('click', () => {
    simulateAuth('spinnerLogin', 'btnLoginText', 'scholarship-radar.html');
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  }
</script>
</body>
</html>
